<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VTuber Studio</title>
  </head>
  <body>
    <div id="app">
      <video id="webcam-source" autoplay playsinline muted></video>

      <div id="viewport-stack">
        <canvas id="overlay-canvas"></canvas>
        <canvas id="scene-canvas"></canvas>
      </div>

      <div id="toolbar">
        <select id="model-select" title="Modèle fourni"></select>
        <label class="button">
          Ouvrir un .vrm…
          <input id="model-file" type="file" accept=".vrm" hidden />
        </label>
      </div>

      <div id="drop-hint">Déposer un fichier .vrm</div>

      <div id="status-bar"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
