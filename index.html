<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>VTuber Studio</title>
  </head>
  <body>
    <div id="app">
      <nav id="menubar"></nav>

      <aside id="left-panel" class="side-panel"></aside>

      <main id="viewport">
        <div id="viewport-stack">
          <video id="webcam-source" autoplay playsinline muted></video>
          <canvas id="scene-canvas"></canvas>
          <canvas id="overlay-canvas"></canvas>
        </div>
        <div id="joint-dock"></div>
        <div id="drop-hint">Déposer un fichier .vrm</div>
      </main>

      <aside id="right-panel" class="side-panel"></aside>

      <footer id="status-bar"></footer>

      <input id="model-file" type="file" accept=".vrm" hidden />
      <input id="settings-file" type="file" accept=".json,application/json" hidden />
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
